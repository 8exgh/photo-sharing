name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - feature/productionize
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.event.repository.name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nextjs_photos/package-lock.json
      
      - name: Install dependencies
        working-directory: ./nextjs_photos
        run: npm ci
      
      - name: Build Next.js application
        working-directory: ./nextjs_photos
        run: npm run build
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DEPLOY_TOKEN }}
      
      - name: Generate timestamp
        id: timestamp
        run: |
          echo "timestamp_tag=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          echo "timestamp_iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.timestamp.outputs.timestamp_tag }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs_photos
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_GIT_HASH=${{ github.sha }}
            NEXT_PUBLIC_GIT_BRANCH=${{ github.ref_name }}
            NEXT_PUBLIC_BUILD_NUMBER=${{ github.run_number }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.timestamp.outputs.timestamp_iso }}

      - name: Trigger Tik Photos deployment
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/devops/dispatches \
            -d '{"event_type":"deploy-${{ github.event.repository.name }}"}'

      - name: Trigger Bennett Photos deployment
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/devops/dispatches \
            -d '{"event_type":"deploy-bennett-photos"}'

      - name: Trigger Bennett Photos deployment
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/devops/dispatches \
            -d '{"event_type":"deploy-photos-productionized"}'

      - name: Push to self hosted container registry
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/devops/dispatches \
            -d '{"event_type":"deploy-tik_tycholaz_container_registry"}'            

            