name: Deploy to Server

on:
  workflow_dispatch:  # Manual trigger
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tik_tycholaz  # Or whatever you named it
  CONTAINER_NAME: nextjs-tik  # Name for your running container

jobs:
  deploy:
    # Only run if the build workflow succeeded (or if manually triggered)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    runs-on: self-hosted  # This targets your self-hosted runner
    
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull latest image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Stop and remove existing container
        run: |
          docker stop ${{ env.CONTAINER_NAME }} || true
          docker rm ${{ env.CONTAINER_NAME }} || true
      
      - name: Run new container
        run: |
          docker run -d \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            -p 3004:3000 \
            -v /path/to/your/photos:/app/photos \
            -v /path/to/your/data:/app/data \
            -e NODE_ENV=production \
            -e ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Health check
        run: |
          sleep 10
          curl -f http://localhost:3004 || exit 1
      
      - name: Cleanup old images
        run: |
          docker image prune -af --filter "until=24h"